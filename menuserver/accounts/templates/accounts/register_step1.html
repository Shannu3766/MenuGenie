{% extends 'base.html' %}

{% block title %}Create your account{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 120px);">
    <div class="card p-0 shadow-lg border-0" style="max-width: 900px; width: 100%; border-radius: 20px;">
        <div class="row g-0">
            <!-- Left Section: Illustration -->
            <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center p-4" style="background: linear-gradient(135deg, #f0f8ff, #e0f2f7); border-top-left-radius: 20px; border-bottom-left-radius: 20px;">
                <img src="https://i.ibb.co/k0Tf5bK/ghostlamp-illustration.png" alt="Registration Illustration" class="img-fluid p-4" style="max-height: 400px; object-fit: contain;">
            </div>

            <!-- Right Section: Registration Form -->
            <div class="col-md-6 p-5">
                <div class="text-center mb-5">
                    <h2 class="h4 fw-bold mb-2" style="color: #333;">Create your account</h2>
                    <p class="text-muted small" style="color: #666;">Step 1 of 3</p>
                </div>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <div class="mb-3 position-relative">
                        <label for="id_email" class="form-label visually-hidden">Email address</label>
                        <div class="input-group has-validation input-group-modern">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="id_email" name="email" required placeholder="Email address">
                            <span class="input-group-text bg-transparent border-start-0 text-success input-addon-check"><i class="fas fa-check-circle"></i></span>
                            <div class="invalid-feedback">
                                Please enter a valid email address.
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold text-white shadow-sm" style="background-color: #0ea5e9; border-color: #0ea5e9;">Next</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f0f2f7;
    }

    .card {
        background-color: #fff;
        border-radius: 20px;
        border: none;
    }

    .input-group-modern .form-control {
        border-color: #e0e0e0;
        border-radius: 8px;
        padding-left: 3.5rem;
        height: 50px;
        background-color: #fcfcfc;
    }

    .input-group-modern .form-control:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 0.2rem rgba(14, 165, 233, 0.25);
    }

    .input-group-modern .input-group-text {
        background-color: #fff;
        border: 1px solid #e0e0e0;
        border-right: none;
        border-radius: 8px 0 0 8px !important;
        padding: 0.75rem 1rem;
        color: #9e9e9e;
    }

    .input-group-modern .input-addon-check {
        background-color: transparent;
        border-left: none;
        border-right: 1px solid #e0e0e0;
        border-radius: 0 8px 8px 0 !important;
        color: #28a745;
    }

    .form-floating > .form-control {
        padding: 0.75rem 0.75rem 0.75rem 3.5rem;
        height: 50px;
    }

    .form-floating > label {
        padding: 0.75rem 0.75rem 0.75rem 3.5rem;
        line-height: 1.5;
        color: #9e9e9e;
    }

    .btn-primary {
        background-color: #0ea5e9;
        border-color: #0ea5e9;
    }

    .btn-primary:hover {
        background-color: #8b5cf6;
        border-color: #8b5cf6;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn-light {
        background-color: #fff;
        border-color: #ddd;
        color: #666;
    }

    .btn-light:hover {
        background-color: #f8f8f8;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .fw-bold {
        font-weight: 700 !important;
    }

    .fw-medium {
        font-weight: 500;
    }

    .text-primary {
        color: #0ea5e9 !important;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');

    form.addEventListener('submit', function(event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    });

    document.querySelectorAll('.form-control').forEach(input => {
        const label = document.querySelector(`label[for='${input.id}']`);
        
        function updateLabelPosition() {
            if (input.value !== '') {
                if (label) {
                    label.style.transform = 'scale(0.85) translateY(-0.5rem) translateX(-0.75rem)';
                    label.style.opacity = '0.7';
                }
            } else {
                if (label) {
                    label.style.transform = 'none';
                    label.style.opacity = '1';
                }
            }
        }

        input.addEventListener('input', updateLabelPosition);
        input.addEventListener('focus', () => {
            if (label) {
                label.style.transform = 'scale(0.85) translateY(-0.5rem) translateX(-0.75rem)';
                label.style.opacity = '0.7';
            }
        });
        input.addEventListener('blur', updateLabelPosition);
        
        updateLabelPosition();
    });
});
</script>
{% endblock %}
