<!-- templates/home.html -->
{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="text-center">
    <h1>Welcome to Menu Server!</h1>
    <p>This is the home page.</p>
    {% if user.is_authenticated %}
        {% if user.is_restaurant_owner %}
            <div class="mt-4">
                <a href="{% url 'menu:my_restaurants' %}" class="btn btn-primary">View My Restaurants</a>
            </div>
        {% endif %}
    {% else %}
        <div class="mt-4">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary me-2">Login</a>
            <a href="{% url 'accounts:register_step1' %}" class="btn btn-outline-primary">Register</a>
        </div>
    {% endif %}
</div>
{% endblock %}
