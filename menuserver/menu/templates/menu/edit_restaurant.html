{% extends 'base.html' %}

{% block title %}Edit Restaurant{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h1 class="h3 mb-0">Edit Restaurant</h1>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="restaurant_name" class="form-label">Restaurant Name</label>
                            <input type="text" class="form-control" id="restaurant_name" name="restaurant_name" value="{{ menu_link.restaurant_name }}" required>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="{% url 'menu:my_restaurants' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
